<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付确认 - Wedesign</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .checkout-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .checkout-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .checkout-header h1 {
            color: #1f2937;
            margin-bottom: 10px;
        }
        
        .checkout-header p {
            color: #6b7280;
            font-size: 18px;
        }
        
        .order-summary {
            background: #f9fafb;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .order-item:last-child {
            border-bottom: none;
        }
        
        .item-info h3 {
            margin: 0 0 5px 0;
            color: #1f2937;
        }
        
        .item-info p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }
        
        .item-price {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            border-top: 2px solid #e5e7eb;
            font-size: 20px;
            font-weight: bold;
        }
        
        .total-amount {
            font-size: 32px;
            color: #667eea;
        }
        
        .payment-methods {
            margin: 30px 0;
        }
        
        .payment-method {
            display: flex;
            align-items: center;
            padding: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .payment-method:hover {
            border-color: #667eea;
            background: #f8fafc;
        }
        
        .payment-method.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .payment-icon {
            width: 40px;
            height: 40px;
            margin-right: 15px;
            background: #667eea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .payment-info h4 {
            margin: 0 0 5px 0;
            color: #1f2937;
        }
        
        .payment-info p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }
        
        .stripe-checkout-btn {
            width: 100%;
            padding: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .stripe-checkout-btn:hover {
            background: #5a67d8;
        }
        
        .stripe-checkout-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .stripe-logo {
            height: 24px;
        }
        
        .security-notice {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
        }
        
        .security-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        
        .security-icon {
            color: #4ade80;
            font-size: 20px;
        }
        
        .back-to-plans {
            text-align: center;
            margin-top: 30px;
        }
        
        .back-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .checkout-container {
                margin: 20px;
                padding: 20px;
            }
            
            .order-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .item-price {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">Wedesign</a>
            <div class="nav-menu">
                <a href="../index.html">首页</a>
                <a href="plans.html">套餐</a>
                <a href="portfolio.html">案例</a>
                <a href="about.html">关于</a>
                <a href="contact.html">联系</a>
            </div>
            <button class="nav-toggle">☰</button>
        </div>
    </nav>

    <!-- 支付确认 -->
    <div class="checkout-container">
        <div class="checkout-header">
            <h1>支付确认</h1>
            <p>请确认您的订单信息并完成支付</p>
        </div>
        
        <!-- 订单摘要 -->
        <div class="order-summary">
            <div class="order-item">
                <div class="item-info">
                    <h3 id="plan-name">Wedesign 基础套餐</h3>
                    <p id="plan-description">基础Logo设计服务，包含3个初稿方案和2次修改</p>
                </div>
                <div class="item-price" id="plan-price">$299.00</div>
            </div>
            
            <div class="order-item">
                <div class="item-info">
                    <h4>设计服务费</h4>
                    <p>专业设计团队服务</p>
                </div>
                <div class="item-price" id="service-fee">$0.00</div>
            </div>
            
            <div class="order-item">
                <div class="item-info">
                    <h4>平台手续费</h4>
                    <p>支付处理费用</p>
                </div>
                <div class="item-price" id="platform-fee">$0.00</div>
            </div>
            
            <div class="order-total">
                <span>总计</span>
                <span class="total-amount" id="total-amount">$299.00</span>
            </div>
        </div>
        
        <!-- 支付方式 -->
        <div class="payment-methods">
            <div class="payment-method selected" id="stripe-payment">
                <div class="payment-icon">💳</div>
                <div class="payment-info">
                    <h4>信用卡/借记卡支付</h4>
                    <p>通过Stripe安全支付，支持Visa、MasterCard、American Express</p>
                </div>
            </div>
        </div>
        
        <!-- 支付按钮 -->
        <button class="stripe-checkout-btn" id="pay-button">
            <svg class="stripe-logo" viewBox="0 0 28 28" fill="currentColor">
                <path d="M13.6 12.3h3.8v-1.8c0-1.1-.9-2-2-2h-1.8c-1.1 0-2 .9-2 2v1.8zm-3.8 3.8h3.8v1.8c0 1.1-.9 2-2 2h-1.8c-1.1 0-2-.9-2-2v-1.8zm7.6-7.6h1.8c1.1 0 2 .9 2 2v1.8h-3.8v-1.8c0-1.1.9-2 2-2zm-7.6 7.6v1.8c0 1.1.9 2 2 2h1.8c1.1 0 2-.9 2-2v-1.8h-3.8z"/>
            </svg>
            前往安全支付页面
        </button>
        
        <!-- 安全提示 -->
        <div class="security-notice">
            <p>🔒 支付过程通过Stripe加密处理，我们不会存储您的信用卡信息</p>
            <div class="security-icons">
                <span class="security-icon">✓</span>
                <span>PCI DSS合规</span>
                <span class="security-icon">✓</span>
                <span>256位SSL加密</span>
                <span class="security-icon">✓</span>
                <span>欺诈检测</span>
            </div>
        </div>
        
        <!-- 返回链接 -->
        <div class="back-to-plans">
            <a href="plans.html" class="back-link">← 返回选择其他套餐</a>
        </div>
    </div>

    <script>
        // 从URL获取套餐信息
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const planType = urlParams.get('plan') || 'basic';
            
            // 套餐配置
            const plans = {
                basic: {
                    name: 'Wedesign 基础套餐',
                    description: '基础Logo设计服务，包含3个初稿方案和2次修改',
                    price: 299.00
                },
                standard: {
                    name: 'Wedesign 标准套餐',
                    description: '完整Logo设计 + 品牌元素，包含5个初稿方案和4次修改',
                    price: 599.00
                },
                premium: {
                    name: 'Wedesign 高级套餐',
                    description: '完整品牌系统设计，包含8个初稿方案和无限修改',
                    price: 999.00
                }
            };
            
            const selectedPlan = plans[planType] || plans.basic;
            
            // 更新页面信息
            document.getElementById('plan-name').textContent = selectedPlan.name;
            document.getElementById('plan-description').textContent = selectedPlan.description;
            document.getElementById('plan-price').textContent = `$${selectedPlan.price.toFixed(2)}`;
            document.getElementById('total-amount').textContent = `$${selectedPlan.price.toFixed(2)}`;
            
            // 支付按钮点击事件
            const payButton = document.getElementById('pay-button');
            payButton.addEventListener('click', async function() {
                // 显示加载状态
                const originalText = this.innerHTML;
                this.innerHTML = '正在跳转到支付页面...';
                this.disabled = true;
                
                try {
                    // 获取支付链接（这里需要师傅提供实际的支付链接）
                    const paymentLinks = {
                        basic: 'https://buy.stripe.com/test_...', // 等待师傅提供
                        standard: 'https://buy.stripe.com/test_...', // 等待师傅提供
                        premium: 'https://buy.stripe.com/test_...'  // 等待师傅提供
                    };
                    
                    const paymentLink = paymentLinks[planType] || paymentLinks.basic;
                    
                    if (paymentLink.includes('...')) {
                        throw new Error('支付链接未配置，请等待师傅提供');
                    }
                    
                    // 跳转到Stripe支付页面
                    window.location.href = paymentLink;
                    
                } catch (error) {
                    console.error('支付跳转失败:', error);
                    alert(`支付处理失败: ${error.message}\n请稍后重试或联系客服。`);
                    
                    // 恢复按钮状态
                    this.innerHTML = originalText;
                    this.disabled = false;
                }
            });
            
            // 移动端导航
            const navToggle = document.querySelector('.nav-toggle');
            const navMenu = document.querySelector('.nav-menu');
            
            if (navToggle && navMenu) {
                navToggle.addEventListener('click', function() {
                    navMenu.style.display = navMenu.style.display === 'flex' ? 'none' : 'flex';
                });
                
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 768) {
                        navMenu.style.display = 'flex';
                    } else {
                        navMenu.style.display = 'none';
                    }
                });
            }
            
            // 检查支付链接是否已配置
            console.log('支付页面已加载，等待师傅提供支付链接配置');
            console.log('需要配置三个支付链接：');
            console.log('1. 基础套餐: https://buy.stripe.com/test_...');
            console.log('2. 标准套餐: https://buy.stripe.com/test_...');
            console.log('3. 高级套餐: https://buy.stripe.com/test_...');
        });
    </script>
</body>
</html>
