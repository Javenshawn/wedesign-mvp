<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI团队真实工作进度监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(30, 30, 46, 0.9);
            border-radius: 20px;
            border: 2px solid rgba(100, 100, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 219, 222, 0.3);
        }
        
        .subtitle {
            font-size: 1.3rem;
            color: #a0a0ff;
            margin-bottom: 25px;
        }
        
        .last-update {
            font-size: 0.9rem;
            color: #8888cc;
            margin-top: 15px;
        }
        
        .main-dashboard {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .team-status {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(100, 100, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .section-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #00dbde;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .section-title::before {
            content: "👥";
            font-size: 1.5rem;
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }
        
        .agent-card {
            background: rgba(20, 20, 40, 0.8);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
        }
        
        .agent-card.working::before { background: linear-gradient(90deg, #00ff88, #00cc66); }
        .agent-card.thinking::before { background: linear-gradient(90deg, #ffaa00, #ff8800); }
        .agent-card.idle::before { background: linear-gradient(90deg, #888888, #666666); }
        
        .agent-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 219, 222, 0.2);
            border-color: #00dbde;
        }
        
        .agent-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .agent-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }
        
        .agent-info {
            flex: 1;
        }
        
        .agent-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
        }
        
        .agent-role {
            font-size: 1rem;
            color: #a0a0ff;
        }
        
        .agent-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .status-working { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .status-thinking { background: rgba(255, 170, 0, 0.2); color: #ffaa00; }
        .status-idle { background: rgba(136, 136, 136, 0.2); color: #888888; }
        
        .current-task {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            border-left: 4px solid #00dbde;
        }
        
        .task-title {
            font-size: 0.9rem;
            color: #8888cc;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .task-title::before {
            content: "📋";
        }
        
        .task-content {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #ffffff;
            min-height: 60px;
        }
        
        .progress-section {
            margin-top: 20px;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #a0a0ff;
        }
        
        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        
        .progress-fill.working { background: linear-gradient(90deg, #00ff88, #00cc66); }
        .progress-fill.thinking { background: linear-gradient(90deg, #ffaa00, #ff8800); }
        
        .recent-activity {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(100, 100, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .activity-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #00dbde;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .activity-title::before {
            content: "📈";
            font-size: 1.5rem;
        }
        
        .activity-list {
            height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .activity-item {
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #00dbde;
            animation: slideIn 0.3s ease;
        }
        
        .activity-item.working { border-left-color: #00ff88; }
        .activity-item.thinking { border-left-color: #ffaa00; }
        
        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .activity-agent {
            font-weight: bold;
            color: #00dbde;
            font-size: 1.1rem;
        }
        
        .activity-time {
            font-size: 0.8rem;
            color: #8888cc;
        }
        
        .activity-content {
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        
        .activity-emotion {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            background: rgba(0, 219, 222, 0.2);
            color: #00dbde;
        }
        
        .summary-section {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(100, 100, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 30px;
        }
        
        .summary-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #00dbde;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .summary-title::before {
            content: "📊";
            font-size: 1.5rem;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        
        .summary-card {
            background: rgba(20, 20, 40, 0.8);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 2px solid rgba(100, 100, 255, 0.2);
        }
        
        .summary-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00dbde;
            margin-bottom: 10px;
        }
        
        .summary-label {
            font-size: 1rem;
            color: #a0a0ff;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            min-width: 180px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        .btn-refresh {
            background: linear-gradient(135deg, #00dbde, #0099cc);
        }
        
        .btn-update {
            background: linear-gradient(135deg, #00ff88, #00cc66);
        }
        
        .btn-reset {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        /* 滚动条样式 */
        .activity-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .activity-list::-webkit-scrollbar-track {
            background: rgba(20, 20, 40, 0.5);
            border-radius: 4px;
        }
        
        .activity-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
        
        .activity-list::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
        
        @media (max-width: 1200px) {
            .main-dashboard {
                grid-template-columns: 1fr;
            }
            
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .agents-grid {
                grid-template-columns: 1fr;
            }
            
            .summary-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 300px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
        
        /* 聊天交互窗口样式 */
        .chat-section {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(100, 100, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 40px;
        }
        
        .chat-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #00dbde;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-title::before {
            content: "💬";
            font-size: 1.5rem;
        }
        
        .chat-container {
            background: rgba(20, 20, 40, 0.8);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(100, 100, 255, 0.2);
        }
        
        .chat-messages {
            height: 300px;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(100, 100, 255, 0.2);
            padding-bottom: 20px;
        }
        
        .message {
            background: rgba(30, 30, 60, 0.8);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }
        
        .message.system {
            background: rgba(0, 100, 200, 0.2);
            border-left: 4px solid #0088ff;
            margin-left: auto;
            margin-right: 0;
        }
        
        .message.agent {
            background: rgba(0, 200, 100, 0.2);
            border-left: 4px solid #00ff88;
            margin-right: auto;
            margin-left: 0;
        }
        
        .message.user {
            background: rgba(200, 100, 0, 0.2);
            border-left: 4px solid #ffaa00;
            margin-left: auto;
            margin-right: 0;
        }
        
        .message-sender {
            font-weight: bold;
            color: #00dbde;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        
        .message-content {
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        
        .message-time {
            font-size: 0.8rem;
            color: #8888cc;
            text-align: right;
        }
        
        .chat-input-container {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .chat-input {
            flex: 1;
            padding: 15px;
            border: 2px solid rgba(100, 100, 255, 0.3);
            border-radius: 10px;
            background: rgba(20, 20, 40, 0.9);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }
        
        .chat-input:focus {
            border-color: #00dbde;
            box-shadow: 0 0 10px rgba(0, 219, 222, 0.3);
        }
        
        .chat-input::placeholder {
            color: #8888cc;
        }
        
        .chat-send-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00dbde, #0099cc);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }
        
        .chat-send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 219, 222, 0.4);
        }
        
        .chat-hint {
            font-size: 0.9rem;
            color: #8888cc;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid rgba(100, 100, 255, 0.2);
        }
        
        /* 聊天滚动条 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(20, 20, 40, 0.5);
            border-radius: 3px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI团队真实工作进度监控系统</h1>
            <div class="subtitle">师傅，这是您布置给我们的实际工作进度 - 实时更新，真实数据</div>
            <div class="last-update" id="last-update">最后更新: 正在加载...</div>
        </header>
        
        <div class="main-dashboard">
            <div class="team-status">
                <div class="section-title">团队成员实时状态</div>
                <div class="agents-grid" id="agents-container">
                    <!-- 代理卡片将通过JavaScript动态生成 -->
                </div>
            </div>
            
            <div class="recent-activity">
                <div class="activity-title">最近工作活动</div>
                <div class="activity-list" id="activity-container">
                    <!-- 活动记录将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
        
        <div class="summary-section">
            <div class="summary-title">工作进度统计</div>
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-value" id="total-tasks">0</div>
                    <div class="summary-label">今日处理任务</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value" id="active-agents">0</div>
                    <div class="summary-label">活跃成员</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value" id="completed-tasks">0</div>
                    <div class="summary-label">已完成任务</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value" id="efficiency">0%</div>
                    <div class="summary-label">工作效率</div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-refresh" onclick="refreshData()">🔄 刷新数据</button>
            <button class="btn-update" onclick="updateAllProgress()">📝 更新进度</button>
            <button class="btn-reset" onclick="resetSystem()">🔄 重置系统</button>
        </div>
        
        <!-- 聊天交互窗口 -->
        <div class="chat-section">
            <div class="chat-title">💬 与AI团队实时交互</div>
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="message system">
                        <div class="message-content">系统：聊天交互已启用，您可以在这里与AI团队成员交流</div>
                        <div class="message-time">刚刚</div>
                    </div>
                    <div class="message agent">
                        <div class="message-sender">小王</div>
                        <div class="message-content">师傅，我在这里！可以随时问我工作进度或布置新任务</div>
                        <div class="message-time">刚刚</div>
                    </div>
                </div>
                <div class="chat-input-container">
                    <input type="text" id="chat-input" placeholder="输入消息与AI团队交流..." class="chat-input">
                    <button onclick="sendMessage()" class="chat-send-btn">发送</button>
                </div>
                <div class="chat-hint">
                    提示：可以询问工作进度、布置新任务、要求汇报等
                </div>
            </div>
        </div>
    </div>

    <script src="real-progress.js"></script>
    <script src="chat-system.js"></script>
</body>
</html>
